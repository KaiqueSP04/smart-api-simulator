openapi: 3.0.3

info:
  title: E-commerce Orders and Payments API
  version: 1.0.0

paths:

  /orders:
    post:
      summary: Cria um pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_name
                - total
              properties:
                customer_name:
                  type: string
                total:
                  type: number
      responses:
        "201":
          description: Pedido criado
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - customer_name
                  - total
                  - status
                properties:
                  id:
                    type: integer
                  customer_name:
                    type: string
                  total:
                    type: number
                  status:
                    type: string

  /orders/{id}:
    get:
      summary: Consulta um pedido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - customer_name
                  - total
                  - status
                properties:
                  id:
                    type: integer
                  customer_name:
                    type: string
                  total:
                    type: number
                  status:
                    type: string

  /payments:
    post:
      summary: Processa um pagamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
                - amount
                - method
              properties:
                order_id:
                  type: integer
                amount:
                  type: number
                method:
                  type: string
      responses:
        "201":
          description: Pagamento processado
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - order_id
                  - amount
                  - method
                  - status
                properties:
                  id:
                    type: integer
                  order_id:
                    type: integer
                  amount:
                    type: number
                  method:
                    type: string
                  status:
                    type: string

  /payments/{id}/confirm:
    post:
      summary: Confirma um pagamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pagamento confirmado
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - order_id
                  - status
                properties:
                  id:
                    type: integer
                  order_id:
                    type: integer
                  status:
                    type: string

  /payments/{id}:
    get:
      summary: Consulta um pagamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pagamento encontrado
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - order_id
                  - amount
                  - method
                  - status
                properties:
                  id:
                    type: integer
                  order_id:
                    type: integer
                  amount:
                    type: number
                  method:
                    type: string
                  status:
                    type: string

  /orders/{id}/cancel:
    post:
      summary: Cancela um pedido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pedido cancelado
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - customer_name
                  - total
                  - status
                properties:
                  id:
                    type: integer
                  customer_name:
                    type: string
                  total:
                    type: number
                  status:
                    type: string

  /payments/{id}/cancel:
    post:
      summary: Cancela um pagamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pagamento cancelado
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - order_id
                  - status
                properties:
                  id:
                    type: integer
                  order_id:
                    type: integer
                  status:
                    type: string